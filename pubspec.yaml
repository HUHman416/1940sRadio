name: radio1940s
description: A 1940s-inspired cross-platform internet radio with Fog Point Radio at its heart.
publish_to: "none"
version: 0.4.2+7

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  audioplayers: ^6.8.1
  flutter_acrylic: ^1.1.4
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  shared_preferences: ^2.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
