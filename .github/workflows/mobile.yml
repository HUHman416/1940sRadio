name: Mobile Builds

on:
  push:
    branches:
      - build-0.4
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create . --platforms=android --org com.huhman416 --project-name radio1940s
      - name: Configure background audio
        run: bash scripts/configure_mobile.sh
      - run: flutter pub get
      - run: flutter analyze lib
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.4.0-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS runner
        run: flutter create . --platforms=ios --org com.huhman416 --project-name radio1940s
      - name: Configure background audio
        run: bash scripts/configure_mobile.sh
      - run: flutter pub get
      - run: flutter analyze lib
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app 1940sRadio-0.4.0-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.4.0-iOS-unsigned
          path: 1940sRadio-0.4.0-iOS-unsigned.zip
          if-no-files-found: error
