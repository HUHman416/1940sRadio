name: Linux AppImage

on:
  push:
    branches:
      - build-0.1
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            libgtk-3-dev \
            librsvg2-bin \
            liblzma-dev \
            ninja-build \
            patchelf \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux desktop runner
        run: flutter create . --platforms=linux --org com.huhman416 --project-name radio1940s

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package AppImage
        run: bash scripts/package_appimage.sh 0.1.0

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.1.0-Linux-x86_64
          path: build/appimage/out/*.AppImage
          if-no-files-found: error
