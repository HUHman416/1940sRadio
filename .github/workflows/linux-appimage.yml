name: Linux AppImage

on:
  push:
    branches:
      - hotfix-0.4.3
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gstreamer1.0-plugins-good \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-bin \
            liblzma-dev \
            mpv \
            ninja-build \
            patchelf \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux desktop runner
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux --org com.huhman416 --project-name radio1940s
          rm -rf test
          bash scripts/configure_linux_transparency.sh

      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter build linux --release

      - name: Package AppImage
        run: bash scripts/package_appimage.sh 0.4.3

      - name: Verify AppImage excludes mixed GLib/GStreamer core
        run: |
          rm -rf build/appimage/verify
          mkdir -p build/appimage/verify
          cd build/appimage/verify
          "../out/1940sRadio-0.4.3-x86_64.AppImage" --appimage-extract >/dev/null
          if find squashfs-root/usr/lib squashfs-root/usr/bin/lib \
              -maxdepth 1 \( -type f -o -type l \) \
              \( -name 'libglib-2.0.so*' -o -name 'libgio-2.0.so*' -o -name 'libgobject-2.0.so*' \
                 -o -name 'libgmodule-2.0.so*' -o -name 'libgthread-2.0.so*' -o -name 'libgstreamer-1.0.so*' \) \
              -print -quit 2>/dev/null | grep -q .; then
            echo "Bundled GLib/GStreamer core library unexpectedly present" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.4.3-Linux-x86_64
          path: build/appimage/out/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.3
          name: Build 0.4.3
          body: |
            Linux startup compatibility hotfix for Build 0.4.

            - Prevents an unsupported `window_manager.setHasShadow` call from aborting Linux startup before Flutter can paint the receiver UI.
            - Treats window-shadow control as cosmetic/best-effort on platforms where the plugin does not implement it.
            - Retains the v0.4.2 AppImage GLib/GStreamer compatibility fix and artifact verification.
            - Retains the v0.4.1 visibility/transparency startup fixes and the full Build 0.4 receiver UI/features.
          files: build/appimage/out/*.AppImage
          fail_on_unmatched_files: true
