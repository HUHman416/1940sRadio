name: Linux AppImage

on:
  push:
    branches:
      - hotfix-0.2.1
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-bin \
            liblzma-dev \
            mpv \
            ninja-build \
            patchelf \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux desktop runner
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux --org com.huhman416 --project-name radio1940s
          rm -rf test

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze lib

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package AppImage
        run: bash scripts/package_appimage.sh 0.2.1

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.2.1-Linux-x86_64
          path: build/appimage/out/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: Build 0.2.1
          body: |
            Linux startup hotfix for Build 0.2.

            - Fixes a black-screen startup caused by calling a macOS-only window-manager method on Linux.
            - Pinning now works by enabling/disabling the radio's own drag regions on Linux and Windows.
            - Startup always transitions to the radio UI even if persistence or a desktop helper reports an error.
            - Adds a visible startup indicator instead of an empty transparent surface.
          files: build/appimage/out/*.AppImage
          fail_on_unmatched_files: true
