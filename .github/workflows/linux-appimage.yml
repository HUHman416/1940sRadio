name: Linux AppImage

on:
  push:
    branches:
      - build-0.2
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-bin \
            liblzma-dev \
            mpv \
            ninja-build \
            patchelf \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux desktop runner
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux --org com.huhman416 --project-name radio1940s
          rm -rf test

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze lib

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package AppImage
        run: bash scripts/package_appimage.sh 0.2.0

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.2.0-Linux-x86_64
          path: build/appimage/out/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Build 0.2
          body: |
            Build 0.2 expands 1940sRadio into a general internet-radio receiver while keeping Fog Point Radio at its heart.

            - Frameless transparent desktop window: visually, the app is just the radio cabinet.
            - Pin/position-lock control and draggable non-control surfaces.
            - In-radio minimize and close controls.
            - Six persistent, user-assignable station presets.
            - Persistent station directory with custom direct stream URLs.
            - Add, edit, remove, and tune saved stations.
            - Current station name/subtitle and tuning needle update on the dial.
            - Fog Point Radio remains the built-in featured/default station.
            - Linux x86_64 AppImage package.
          files: build/appimage/out/*.AppImage
          fail_on_unmatched_files: true
