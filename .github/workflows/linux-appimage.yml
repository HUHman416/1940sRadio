name: Linux Desktop + AppImage

on:
  push:
    branches:
      - build-0.5
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gstreamer1.0-plugins-good \
            libayatana-appindicator3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-bin \
            liblzma-dev \
            mpv \
            ninja-build \
            patchelf \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux desktop runner
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux --org com.huhman416 --project-name radio1940s
          rm -rf test
          bash scripts/configure_linux_transparency.sh
          grep -q 'gdk_screen_get_rgba_visual' linux/runner/my_application.cc
          grep -q 'gtk_widget_set_app_paintable' linux/runner/my_application.cc

      - run: flutter pub get

      - name: Analyze Dart sources
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze lib 2>&1 | tee flutter-analyze.log

      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-diagnostics
          path: flutter-analyze.log
          if-no-files-found: error

      - name: Require clean analysis
        if: steps.analyze.outcome != 'success'
        run: exit 1

      - run: flutter build linux --release

      - name: Package portable AppImage
        run: bash scripts/package_appimage.sh 0.5.0

      - name: Package installable desktop archive
        run: bash scripts/package_linux_installer.sh 0.5.0

      - name: Validate installer scripts
        run: |
          bash -n scripts/install_linux.sh
          bash -n scripts/uninstall_linux.sh
          bash -n scripts/package_linux_installer.sh

      - name: Verify AppImage excludes mixed GLib/GStreamer core
        run: |
          rm -rf build/appimage/verify
          mkdir -p build/appimage/verify
          cd build/appimage/verify
          "../out/1940sRadio-0.5.0-x86_64.AppImage" --appimage-extract >/dev/null
          if find squashfs-root/usr/lib squashfs-root/usr/bin/lib \
              -maxdepth 1 \( -type f -o -type l \) \
              \( -name 'libglib-2.0.so*' -o -name 'libgio-2.0.so*' -o -name 'libgobject-2.0.so*' \
                 -o -name 'libgmodule-2.0.so*' -o -name 'libgthread-2.0.so*' -o -name 'libgstreamer-1.0.so*' \) \
              -print -quit 2>/dev/null | grep -q .; then
            echo "Bundled GLib/GStreamer core library unexpectedly present" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.5.0-Linux-x86_64
          path: |
            build/appimage/out/*.AppImage
            build/linux-installer/out/*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Build 0.5 — The Receiver Update
          body: |
            Build 0.5 makes 1940s Radio feel like a complete desktop receiver.

            - Moves Fog Point Radio to the current Radio.co direct stream and adds a remotely refreshable built-in station manifest.
            - Adds slider-based tuning designed for mouse and future touch controls.
            - Adds compact receiver mode, favorites, receiver configuration import/export, stream testing, stronger reconnect behavior, and persistent volume/window placement.
            - Expands alarms with weekdays, wake station, wake volume and gentle tube warm-up; sleep timers now fade during their final minute.
            - Adds Off / Subtle / Period radio-atmosphere modes.
            - Adds desktop tray controls for show, power, volume, presets and graceful quit.
            - Reworks shutdown so media resources are stopped and disposed before the window is destroyed.
            - Ships both a portable AppImage and a per-user Linux desktop installer archive with launcher integration and an uninstall command.
            - Retains the Build 0.4.4 GTK RGBA transparency and AppImage compatibility fixes.
          files: |
            build/appimage/out/*.AppImage
            build/linux-installer/out/*.tar.gz
          fail_on_unmatched_files: true
