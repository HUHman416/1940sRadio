name: Linux AppImage

on:
  push:
    branches:
      - hotfix-0.4.1
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gstreamer1.0-plugins-good \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libmpv-dev \
            librsvg2-bin \
            liblzma-dev \
            mpv \
            ninja-build \
            patchelf \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux desktop runner
        run: |
          flutter config --enable-linux-desktop
          flutter create . --platforms=linux --org com.huhman416 --project-name radio1940s
          rm -rf test
          bash scripts/configure_linux_transparency.sh

      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter build linux --release

      - name: Package AppImage
        run: bash scripts/package_appimage.sh 0.4.1

      - uses: actions/upload-artifact@v4
        with:
          name: 1940sRadio-0.4.1-Linux-x86_64
          path: build/appimage/out/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1
          name: Build 0.4.1
          body: |
            Linux startup hotfix for Build 0.4.

            - Removes the competing hidden-window startup race between window_manager and flutter_acrylic.
            - Lets Flutter attach and paint before applying native transparency.
            - Explicitly shows and focuses the radio after the transparency effect is applied.
            - Adds a delayed visibility failsafe for Linux/Wayland compositors.
            - Retains the Build 0.4 receiver UI, atmosphere, station, timer, and history features.
          files: build/appimage/out/*.AppImage
          fail_on_unmatched_files: true
